# Loaded by gazebo_ros2_control (see libbot_description/urdf/control/ros2_control.urdf.xacro)
# The controller_manager node is created under the /libbot namespace by
# gazebo_ros2_control's <ros><namespace> tag, but it loads this file via a
# raw --params-file argument (not through `ros2 launch`'s Node action), so
# strict ROS2 param-YAML node-name matching applies. Using the "/**"
# wildcard makes these params apply regardless of namespace.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      mecanum_drive_controller:
        type: mecanum_drive_controller/MecanumDriveController

  joint_state_broadcaster:
    ros__parameters:
      joints:
        - front_left_wheel_joint
        - front_right_wheel_joint
        - rear_left_wheel_joint
        - rear_right_wheel_joint

  mecanum_drive_controller:
    ros__parameters:
      reference_timeout: 0.5
      front_left_wheel_command_joint_name: front_left_wheel_joint
      front_right_wheel_command_joint_name: front_right_wheel_joint
      rear_right_wheel_command_joint_name: rear_right_wheel_joint
      rear_left_wheel_command_joint_name: rear_left_wheel_joint
      front_left_wheel_state_joint_name: front_left_wheel_joint
      front_right_wheel_state_joint_name: front_right_wheel_joint
      rear_right_wheel_state_joint_name: rear_right_wheel_joint
      rear_left_wheel_state_joint_name: rear_left_wheel_joint

      # use plain geometry_msgs/Twist on ~/reference (matches Nav2 & teleop_twist_keyboard output)
      use_stamped_vel: false

      base_frame_id: base_footprint
      odom_frame_id: odom
      # robot_localization's EKF owns the odom->base_footprint TF (see
      # libbot_localization/config/ekf.yaml); the controller only publishes
      # the /libbot/mecanum_drive_controller/odometry topic as one of the
      # EKF's two inputs (the other being IMU).
      enable_odom_tf: false

      kinematics:
        # wheels_radius must match libbot_description base.urdf.xacro wheel_radius
        wheels_radius: 0.075
        # = wheel_sep_x + wheel_sep_y from libbot_description base.urdf.xacro
        sum_of_robot_center_projection_on_X_Y_axis: 0.40

      twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
      pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
