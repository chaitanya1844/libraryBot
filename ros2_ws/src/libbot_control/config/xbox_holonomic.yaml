# Xbox 360 controller mapping for holonomic (mecanum) teleop.
# Standard Linux xpad joystick axis/button numbering:
#   axis 0: left stick X (left/right)      axis 1: left stick Y (up/down)
#   axis 3: right stick X (left/right)     axis 4: right stick Y (up/down)
#   axis 2/5: LT/RT triggers               axis 6/7: D-pad X/Y
#   button 4: LB   button 5: RB   button 6: back   button 7: start
#
# Controls: left stick = drive (forward/back + strafe left/right),
# right stick X = rotate. Hold LB (enable_button) to move at all -- a
# deadman switch so letting go of the controller always stops the robot.
# Hold RB too (enable_turbo_button) for the faster turbo scale.
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1   # left stick vertical -> forward/back
      y: 0   # left stick horizontal -> strafe left/right
    scale_linear:
      x: 0.3
      y: 0.25
    scale_linear_turbo:
      x: 0.5
      y: 0.4

    axis_angular:
      yaw: 3  # right stick horizontal -> rotate
    scale_angular:
      yaw: 0.5
    scale_angular_turbo:
      yaw: 0.8

    enable_button: 4        # LB: hold to drive (deadman switch)
    enable_turbo_button: 5  # RB: hold with LB for turbo speed

    require_enable_button: true
