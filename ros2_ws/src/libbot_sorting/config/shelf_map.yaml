# Maps human-friendly shelf_id -> Gazebo model + nav2 approach pose (map frame).
# Regenerate against worlds/library.world if the world layout changes.
# approach_pose is an automatically computed 0.9m standoff facing each shelf's
# center; it has NOT been hand-verified against the aisle layout for every
# shelf, so nudge an entry here if its real approach point turns out to be
# too close to a desk/column/other shelf. shelf_pose is the shelf model's own
# pose (useful for the depth-camera shelf-slot inference node).
shelves:
  FICTION-A1:
    gazebo_model: "BookshelfA_01_001"
    genre: "fiction"
    approach_pose:
      x: 0.779
      y: -0.803
      yaw: -0.801
    shelf_pose:
      x: 1.405
      y: -1.45
